<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Dashboard | Bright Smile & Skin Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    body {
      background-color: var(--bs-bg);
      color: var(--bs-on-surface);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding-top: 80px; /* Header space */
    }
    
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 70px;
      background: var(--bs-header-bg);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      z-index: 100;
    }
    
    .nav-brand {
      font-weight: 700;
      font-size: 1.25rem;
    }
    
    .btn-logout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--bs-on-surface);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    
    .btn-logout:hover {
      background: rgba(255,255,255,0.05);
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--bs-primary), #d4a5a5);
      color: var(--bs-on-primary);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
    }
    
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .post-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-radius: 12px;
      background: var(--bs-surface-container);
    }
    
    .post-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0 0 0.25rem 0;
    }
    
    .post-meta {
      font-size: 0.875rem;
      color: var(--bs-text-muted);
    }
    
    .post-actions button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--bs-on-surface);
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 0.5rem;
    }
    .post-actions button:hover {
      background: rgba(255,255,255,0.1);
    }
    .post-actions .delete-btn:hover {
      background: rgba(248, 113, 113, 0.2);
      border-color: #f87171;
      color: #f87171;
    }
    
    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 18, 37, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      width: 100%;
      max-width: 600px;
      background: var(--bs-surface);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(232,168,124,0.15);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--bs-on-surface-variant);
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      background: var(--bs-surface-container-high);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: white;
      font-family: inherit;
      box-sizing: border-box;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--bs-primary);
    }
    textarea.form-control {
      min-height: 150px;
      resize: vertical;
    }
    
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .btn-secondary {
      background: transparent;
      color: var(--bs-on-surface);
      border: none;
      cursor: pointer;
    }
    
    .btn-generate {
      background: rgba(232,168,124,0.15);
      color: var(--bs-primary);
      border: 1px solid rgba(232,168,124,0.3);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .btn-generate:hover {
      background: rgba(232,168,124,0.25);
    }
  </style>
</head>
<body>
  <div class="orb-1"></div>

  <nav class="navbar">
    <div class="nav-brand gradient-text">CMS Dashboard</div>
    <button id="logoutBtn" class="btn-logout">Sign Out</button>
  </nav>

  <div class="container">
    <div class="dashboard-header">
      <div>
        <h1 style="margin: 0 0 0.5rem 0;">Blog Posts</h1>
        <p style="margin: 0; color: var(--bs-text-muted);">Manage content on the main Bright Smile website.</p>
      </div>
      <button id="newPostBtn" class="btn-primary">
        <span class="material-symbols-outlined">add</span> New Post
      </button>
    </div>
    
    <div class="post-list" id="postList">
      <div style="text-align: center; padding: 2rem; color: var(--bs-text-muted);">Loading posts...</div>
    </div>
  </div>

  <!-- Post Editor Modal -->
  <div class="modal" id="postModal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top: 0;">Create Post</h2>
      <form id="postForm">
        <input type="hidden" id="postId">
        
        <div class="form-group">
          <label for="postTitle">Title</label>
          <input type="text" id="postTitle" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="postCategory">Category</label>
          <input type="text" id="postCategory" class="form-control" placeholder="e.g. Teeth Whitening" required>
        </div>
        
        <div class="form-group">
          <label for="postExcerpt">Excerpt (Summary)</label>
          <textarea id="postExcerpt" class="form-control" style="min-height: 80px;" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="postContent">Content (HTML)</label>
          <textarea id="postContent" class="form-control" required></textarea>
          
          <!-- Worzl Agent Hook -->
          <button type="button" class="btn-generate" id="generateSocialBtn">
            <span class="material-symbols-outlined">magic_button</span> Generate Social Media Post (Worzl)
          </button>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save Post</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db, onAuthStateChanged, signOut, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy, serverTimestamp } from './firebase-init.js';
    
    // Auth Guard
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        loadPosts();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth);
    });

    // DOM Elements
    const postList = document.getElementById('postList');
    const postModal = document.getElementById('postModal');
    const postForm = document.getElementById('postForm');
    const newPostBtn = document.getElementById('newPostBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const modalTitle = document.getElementById('modalTitle');

    // UI state
    let posts = [];

    // Open modal for new
    newPostBtn.addEventListener('click', () => {
      postForm.reset();
      document.getElementById('postId').value = '';
      modalTitle.textContent = 'Create Post';
      postModal.classList.add('active');
    });

    // Close modal
    cancelBtn.addEventListener('click', () => {
      postModal.classList.remove('active');
    });

    // Fetch and render posts
    async function loadPosts() {
      postList.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--bs-text-muted);">Loading posts...</div>';
      try {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        posts = [];
        querySnapshot.forEach((doc) => {
          posts.push({ id: doc.id, ...doc.data() });
        });
        renderPosts();
      } catch (e) {
        console.error("Error loading posts:", e);
        postList.innerHTML = '<div style="color: #f87171; text-align: center; padding: 2rem;">Error loading posts. Ensure Firestore is configured.</div>';
      }
    }

    function renderPosts() {
      if (posts.length === 0) {
        postList.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--bs-text-muted);">No posts found. Create one!</div>';
        return;
      }
      
      postList.innerHTML = '';
      posts.forEach(post => {
        const date = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleDateString('en-GB') : 'Just now';
        
        const el = document.createElement('div');
        el.className = 'post-item';
        el.innerHTML = `
          <div>
            <h3 class="post-title">${escapeHtml(post.title)}</h3>
            <div class="post-meta">
              <span style="color: var(--bs-primary); margin-right: 8px;">${escapeHtml(post.category)}</span>
              ${date}
            </div>
          </div>
          <div class="post-actions">
            <button class="edit-btn" data-id="${post.id}"><span class="material-symbols-outlined">edit</span></button>
            <button class="delete-btn" data-id="${post.id}"><span class="material-symbols-outlined">delete</span></button>
          </div>
        `;
        postList.appendChild(el);
      });

      // Bind events
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => editPost(e.currentTarget.dataset.id));
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => deletePost(e.currentTarget.dataset.id));
      });
    }

    // Save post
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const id = document.getElementById('postId').value;
      const data = {
        title: document.getElementById('postTitle').value,
        category: document.getElementById('postCategory').value,
        excerpt: document.getElementById('postExcerpt').value,
        content: document.getElementById('postContent').value,
      };

      try {
        if (id) {
          // Update
          await updateDoc(doc(db, "posts", id), data);
        } else {
          // Create
          data.createdAt = serverTimestamp();
          await addDoc(collection(db, "posts"), data);
        }
        postModal.classList.remove('active');
        await loadPosts();
      } catch (err) {
        console.error("Error saving post", err);
        alert("Failed to save post");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Post';
      }
    });

    function editPost(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;
      
      document.getElementById('postId').value = post.id;
      document.getElementById('postTitle').value = post.title || '';
      document.getElementById('postCategory').value = post.category || '';
      document.getElementById('postExcerpt').value = post.excerpt || '';
      document.getElementById('postContent').value = post.content || '';
      
      modalTitle.textContent = 'Edit Post';
      postModal.classList.add('active');
    }

    async function deletePost(id) {
      if (confirm('Are you sure you want to delete this post?')) {
        try {
          await deleteDoc(doc(db, "posts", id));
          await loadPosts();
        } catch(e) {
          console.error("Error deleting", e);
        }
      }
    }

    function escapeHtml(unsafe) {
      if(!unsafe) return '';
      return unsafe
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    // Worzl Agent Logic
    document.getElementById('generateSocialBtn').addEventListener('click', async () => {
      const title = document.getElementById('postTitle').value;
      const excerpt = document.getElementById('postExcerpt').value;
      if(!title || !excerpt) {
        alert("Please enter a title and excerpt first so Worzl has context to draft a post.");
        return;
      }
      
      const btn = document.getElementById('generateSocialBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">autorenew</span> Generating...';
      
      // Simulate Agent API Call (To be integrated with real Worzl backend)
      setTimeout(() => {
        const draft = `🌟 Exciting news from Bright Smile! 🌟\n\nWe've just published a new guide: "${title}".\n\n${excerpt}\n\nRead the full article on our website! Link in bio. ✨\n\n#BrightSmileAndSkin #NewcastleUnderLyme #StaffordshireAesthetics #BeautyTreatments`;
        alert("Worzl drafted this for you:\n\n" + draft + "\n\n(Note: In Phase 2, this will save to your Social Approval Dashboard!)");
        btn.innerHTML = originalText;
      }, 1500);
    });

    // Add spin animation dynamically
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
