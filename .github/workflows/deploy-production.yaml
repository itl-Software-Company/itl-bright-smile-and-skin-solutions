name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "PRODUCTION" to confirm deployment'
        required: true
        default: ''
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west2
  SERVICE_NAME: bright-smile-prod

jobs:
  validate:
    name: Validate Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ Production deployment cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: Verify branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "❌ Production deployments must be from main branch"
            exit 1
          fi
          echo "✅ Deploying from main branch"

  deploy:
    name: Deploy to Cloud Run (Production)
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.GCP_PROJECT_ID }} \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 20

      - name: Get Service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $SERVICE_URL"

      - name: Create Git Tag
        if: github.event.inputs.version != ''
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ github.event.inputs.version }} -m "Production release ${{ github.event.inputs.version }}"
          git push origin ${{ github.event.inputs.version }}

      - name: Deploy Summary
        run: |
          echo "### 🎉 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "**Version:** ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
